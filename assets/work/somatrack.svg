<rect x="36" y="62" width="568" height="72" rx="10" fill="#ffffff" fill-opacity=".04" stroke="#ffffff" stroke-opacity=".08"/><text x="52" y="92" class="sans" font-size="15" fill="#ffffff" fill-opacity=".75">"I study <tspan fill="#fbbf24" fill-opacity="1" font-weight="700">7 hours</tspan> a day, mostly <tspan fill="#fb7185" fill-opacity="1" font-weight="700">on my bed</tspan> with the</text><text x="52" y="116" class="sans" font-size="15" fill="#ffffff" fill-opacity=".75"><tspan fill="#fb7185" fill-opacity="1" font-weight="700">laptop on my knees</tspan>, and take a break <tspan fill="#22d3ee" fill-opacity="1" font-weight="700">every 2 hours</tspan>."</text><rect x="36" y="146" width="72" height="24" rx="12" fill="#fbbf24" fill-opacity=".14" stroke="#fbbf24" stroke-opacity=".5"/><text x="72" y="162" text-anchor="middle" class="mono" font-size="11.5" fill="#fbbf24">hours=7</text><rect x="116" y="146" width="101" height="24" rx="12" fill="#fb7185" fill-opacity=".14" stroke="#fb7185" stroke-opacity=".5"/><text x="166" y="162" text-anchor="middle" class="mono" font-size="11.5" fill="#fb7185">surface=bed</text><rect x="225" y="146" width="94" height="24" rx="12" fill="#fb7185" fill-opacity=".14" stroke="#fb7185" stroke-opacity=".5"/><text x="272" y="162" text-anchor="middle" class="mono" font-size="11.5" fill="#fb7185">screen=lap</text><rect x="327" y="146" width="116" height="24" rx="12" fill="#22d3ee" fill-opacity=".14" stroke="#22d3ee" stroke-opacity=".5"/><text x="385" y="162" text-anchor="middle" class="mono" font-size="11.5" fill="#22d3ee">breaks=120min</text><text x="36" y="204" class="mono" font-size="11.5" fill="#ffffff" fill-opacity=".65">back pain</text><rect x="140" y="196" width="200" height="9" rx="4.5" fill="#ffffff" fill-opacity=".07"/><rect x="140" y="196" width="148" height="9" rx="4.5" fill="#fb7185"><animate attributeName="width" values="0;148" dur="1.6s"/></rect><text x="352" y="204" class="mono" font-size="11.5" fill="#fb7185">0.74</text><text x="36" y="224" class="mono" font-size="11.5" fill="#ffffff" fill-opacity=".65">neck strain</text><rect x="140" y="216" width="200" height="9" rx="4.5" fill="#ffffff" fill-opacity=".07"/><rect x="140" y="216" width="132" height="9" rx="4.5" fill="#fb7185"><animate attributeName="width" values="0;132" dur="1.6s"/></rect><text x="352" y="224" class="mono" font-size="11.5" fill="#fb7185">0.66</text><text x="36" y="244" class="mono" font-size="11.5" fill="#ffffff" fill-opacity=".65">eye strain</text><rect x="140" y="236" width="200" height="9" rx="4.5" fill="#ffffff" fill-opacity=".07"/><rect x="140" y="236" width="116" height="9" rx="4.5" fill="#fbbf24"><animate attributeName="width" values="0;116" dur="1.6s"/></rect><text x="352" y="244" class="mono" font-size="11.5" fill="#fbbf24">0.58</text><text x="36" y="264" class="mono" font-size="11.5" fill="#ffffff" fill-opacity=".65">headache</text><rect x="140" y="256" width="200" height="9" rx="4.5" fill="#ffffff" fill-opacity=".07"/><rect x="140" y="256" width="82" height="9" rx="4.5" fill="#fbbf24"><animate attributeName="width" values="0;82" dur="1.6s"/></rect><text x="352" y="264" class="mono" font-size="11.5" fill="#fbbf24">0.41</text><text x="36" y="284" class="mono" font-size="11.5" fill="#ffffff" fill-opacity=".65">wrist pain</text><rect x="140" y="276" width="200" height="9" rx="4.5" fill="#ffffff" fill-opacity=".07"/><rect x="140" y="276" width="66" height="9" rx="4.5" fill="#a3e635"><animate attributeName="width" values="0;66" dur="1.6s"/></rect><text x="352" y="284" class="mono" font-size="11.5" fill="#a3e635">0.33</text><text x="36" y="304" class="mono" font-size="11.5" fill="#ffffff" fill-opacity=".65">finger numb.</text><rect x="140" y="296" width="200" height="9" rx="4.5" fill="#ffffff" fill-opacity=".07"/><rect x="140" y="296" width="36" height="9" rx="4.5" fill="#a3e635"><animate attributeName="width" values="0;36" dur="1.6s"/></rect><text x="352" y="304" class="mono" font-size="11.5" fill="#a3e635">0.18</text><text x="36" y="324" class="mono" font-size="11.5" fill="#ffffff" fill-opacity=".65">overall</text><rect x="140" y="316" width="200" height="9" rx="4.5" fill="#ffffff" fill-opacity=".07"/><rect x="140" y="316" width="122" height="9" rx="4.5" fill="#fb7185"><animate attributeName="width" values="0;122" dur="1.6s"/></rect><text x="352" y="324" class="mono" font-size="11.5" fill="#fb7185">0.61</text><rect x="404" y="188" width="200" height="146" rx="10" fill="#0a120f" stroke="#a3e635" stroke-opacity=".35"/><text x="420" y="212" class="mono" font-size="12" fill="#a3e635">what to change</text><text x="420" y="242" class="sans" font-size="13" fill="#ffffff" fill-opacity=".85">Work at a desk</text><text x="588" y="242" text-anchor="end" class="mono" font-size="12" fill="#a3e635">−0.21</text><text x="420" y="268" class="sans" font-size="13" fill="#ffffff" fill-opacity=".85">Break every 45 min</text><text x="588" y="268" text-anchor="end" class="mono" font-size="12" fill="#a3e635">−0.12</text><text x="420" y="294" class="sans" font-size="13" fill="#ffffff" fill-opacity=".85">Raise the screen</text><text x="588" y="294" text-anchor="end" class="mono" font-size="12" fill="#a3e635">−0.09</text><text x="420" y="320" class="mono" font-size="10.5" fill="#ffffff" fill-opacity=".4">change in back-pain risk</text>
</g>
