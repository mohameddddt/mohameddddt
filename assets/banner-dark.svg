<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Mohamed Sahnoune Toubal, AI engineering student at ENSIA, Algiers.">
<style>
.sans{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace}
.flow{animation:flow 3.6s linear infinite}
@keyframes flow{from{stroke-dashoffset:14}to{stroke-dashoffset:-430}}
.pulse{animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.flow,.pulse,.blink{animation:none}}
</style>
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#232b3b"/></pattern>
  <linearGradient id="fade" x1="0" x2="1"><stop offset="0" stop-color="#111723"/><stop offset=".55" stop-color="#111723" stop-opacity=".2"/><stop offset="1" stop-color="#111723" stop-opacity="0"/></linearGradient>
  <clipPath id="r"><rect width="1200" height="400" rx="20"/></clipPath>
</defs>
<g clip-path="url(#r)">
  <rect width="1200" height="400" fill="#111723"/>
  <rect width="1200" height="400" fill="url(#dots)"/>
  <rect width="1200" height="400" fill="url(#fade)"/>
