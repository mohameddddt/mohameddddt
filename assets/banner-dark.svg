<text x="70" y="150" class="sans" font-size="68" font-weight="800" letter-spacing="-2" fill="#e8ecf4">Mohamed</text>
<text x="70" y="222" class="sans" font-size="68" font-weight="800" letter-spacing="-2" fill="#e8ecf4">Sahnoune Toubal<tspan fill="#22d3ee">.</tspan></text>
<text x="72" y="266" class="sans" font-size="21" fill="#8b95a7">AI engineering student. I train models for vision, speech</text>
<text x="72" y="294" class="sans" font-size="21" fill="#8b95a7">and language, and build the apps they live in.</text>
